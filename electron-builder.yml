appId: ai.ohmygame.desktop
productName: OhMyGame
asar: true
beforePack: scripts/prepare-desktop-typebox.mjs
afterPack: scripts/check-packaged-desktop.mjs
asarUnpack:
  - node_modules/esbuild/**/*
  - node_modules/@esbuild/**/*
  - dist/player/**/*

directories:
  output: release

releaseInfo:
  releaseNotesFile: .runtime/release-notes.md

files:
  - dist/desktop/**/*.js
  - dist/desktop/**/*.cjs
  - dist/daemon/**/*.js
  - dist/daemon/assets/scene-templates/*.webp
  - dist/daemon/assets/scene-templates/NOTICE.txt
  - dist/daemon/assets/scene-templates/LICENSE.txt
  - dist/shared/**/*.js
  - dist/story-web/resources.json
  - dist/renderer/**/*
  - dist/player/**/*
  # Local builds never ship source maps.
  - "!dist/renderer/**/*.map"
  - "!node_modules/typebox/build/**/*.mjs"
  - from: .runtime/typebox
    to: node_modules/typebox/build
  # Dependency packaging skips top-level examples, including Three's official add-ons.
  - from: node_modules/three/examples/jsm
    to: node_modules/three/examples/jsm
    filter:
      - loaders/GLTFLoader.js
      - utils/BufferGeometryUtils.js

extraResources:
  - from: plugins
    to: plugins
  - from: integrations/skills
    to: integrations/skills
  # Match from the parent so electron-builder retains Node's root node_modules.
  - from: .runtime
    to: runtime
    filter:
      - node/**/*

mac:
  icon: build/icon.icns
  category: public.app-category.developer-tools
  hardenedRuntime: true
  notarize: true
  target:
    - dmg
    - zip

win:
  icon: build/icon.ico
  target:
    - nsis
  artifactName: OhMyGame-${version}-${arch}.${ext}

nsis:
  include: build/installer.nsh
  # The installer follows the app's UI languages; other systems get English.
  installerLanguages:
    - en_US
    - zh_CN
  deleteAppDataOnUninstall: false
  # Show the setup wizard so users can choose the install scope and location.
  oneClick: false
  allowToChangeInstallationDirectory: true

publish: null

dmg:
  artifactName: OhMyGame-${version}-${arch}.${ext}
