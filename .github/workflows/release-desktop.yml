name: Local desktop release policy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-only:
    runs-on: ubuntu-latest
    steps:
      - name: Remote release disabled
        run: |
          echo "Remote release publishing is disabled in this local-only build."
          echo "Build reviewed local packages with package:mac:dir, package:mac, or package:win."
